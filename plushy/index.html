<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14231a">
<title>Plushy Guardian of the Tiny Forest</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 8px;pointer-events:none;text-shadow:0 2px 5px #000;z-index:2}.meters{display:grid;gap:5px;width:min(74vw,420px);font-size:12px}.row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.bar{height:10px;border:1px solid #fff5;border-radius:20px;background:#0007;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#eee3cb}.bar.forest i{width:0;background:#98c96a}#objective{font-size:12px;margin-top:6px}.panel{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,540px);padding:24px;border:1px solid #e4d6b650;border-radius:24px;background:radial-gradient(circle at top,#304735f5,#142119fa 70%);box-shadow:0 24px 80px #000b;text-align:center;display:none}.panel.show{display:block}.panel h1{margin:0;font-size:clamp(34px,9vw,64px);line-height:.9}.panel h1 small{font-size:.38em;color:#d6e8c8}.panel p{line-height:1.45;color:#d9e1d6}button{border:1px solid #fff6;border-radius:999px;background:#e7d8b7;color:#1e2a20;font-weight:900;padding:13px 20px;font-size:16px}#touch{position:fixed;z-index:3;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:18px;pointer-events:none}#stick{width:116px;height:116px;border-radius:50%;border:2px solid #fff3;background:#0004;position:relative;pointer-events:auto}#nub{width:52px;height:52px;position:absolute;left:30px;top:30px;border-radius:50%;background:#e7d8b799;box-shadow:inset 0 0 0 2px #fff4}.actions{display:flex;gap:12px;pointer-events:auto}.actions button{width:70px;height:70px;padding:0;font-size:30px;background:#17281ddd;color:#fff}.back{position:fixed;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));font-size:12px;color:#fff8;text-decoration:none}@media(pointer:fine) and (min-width:900px){#touch{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<a class="back" href="/">sneaker.games ↗</a>
<div id="hud"><div class="meters"><div class="row"><span>Stuffing</span><div class="bar"><i id="hp"></i></div></div><div class="row"><span>Forest</span><div class="bar forest"><i id="forest"></i></div></div></div><div id="objective">Cleanse the clearing.</div></div>
<div id="start" class="panel show"><h1>Plushy Guardian<br><small>of the Tiny Forest</small></h1><p>You are very small. The forest is very large. This is apparently your problem.</p><p><b>Move:</b> left thumb / WASD<br><b>Vine spell:</b> ✨ / Space<br><b>Dodge:</b> 🍃 / Shift</p><button id="go">Begin Tiny Heroics</button></div>
<div id="end" class="panel"><h2 id="endTitle">The clearing blooms!</h2><p id="endCopy"></p><button id="again">Again, tiny guardian</button></div>
<div id="touch"><div id="stick"><div id="nub"></div></div><div class="actions"><button id="cast">✨</button><button id="dodge">🍃</button></div></div>
<script>
(()=>{
const c=document.querySelector('#game'),x=c.getContext('2d'),hp=document.querySelector('#hp'),forest=document.querySelector('#forest'),obj=document.querySelector('#objective'),start=document.querySelector('#start'),end=document.querySelector('#end');
let W,H,D=1,last=0,run=false,t=0,shake=0,flash=0,P,T,E,S,SE,M,FX,F;const K=new Set(),V={x:0,y:0};
const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v)),L=(a,b)=>Math.hypot(a,b)||1,DS=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function reset(){P={x:W*.5,y:H*.62,r:29,hp:100,max:100,speed:205,inv:0,dodge:0,cast:0,score:0,hit:0};T={x:W*.5,y:H*.22,r:58,hp:150,max:150,awake:false};E=[];S=[];SE=[];M=[];FX=[];F=[];for(let i=0;i<24;i++)F.push({x:R(25,W-25),y:R(80,H-25),a:R(0,7),on:false});wave(5);hud()}
function wave(n){for(let i=0;i<n;i++){let a=R(0,Math.PI*2),r=Math.max(W,H)*.42;E.push({x:W*.5+Math.cos(a)*r,y:H*.5+Math.sin(a)*r,r:18,hp:34,speed:R(50,75),kind:Math.random()<.28?1:0,hurt:0})}}
function hud(){hp.style.width=P.hp+'%';forest.style.width=C(P.score/7*100,0,100)+'%';obj.textContent=T.awake?'The old tree is corrupted — cleanse it!':'Restore the clearing: '+Math.min(P.score,7)+' / 7 seeds'}
function burst(px,py,n=10,type=0){for(let i=0;i<n;i++)FX.push({x:px,y:py,vx:R(-120,120),vy:R(-120,70),life:R(.35,.85),type,s:R(3,8)})}
function fire(){if(!run||P.cast>0)return;P.cast=.34;let dx=0,dy=-1;if(K.has('KeyA')||K.has('ArrowLeft')){dx=-1;dy=0}if(K.has('KeyD')||K.has('ArrowRight')){dx=1;dy=0}if(K.has('KeyS')||K.has('ArrowDown')){dx=0;dy=1}if(Math.abs(V.x)>.2||Math.abs(V.y)>.2){let l=L(V.x,V.y);dx=V.x/l;dy=V.y/l}S.push({x:P.x+dx*28,y:P.y+dy*28,vx:dx*430,vy:dy*430,r:11,life:.9});burst(P.x+dx*20,P.y+dy*20,5,1)}
function dodge(){if(!run||P.dodge>0)return;P.dodge=.75;P.inv=.32;burst(P.x,P.y,12,0)}
addEventListener('keydown',e=>{K.add(e.code);if(e.code==='Space'){e.preventDefault();fire()}if(e.code.includes('Shift'))dodge()});addEventListener('keyup',e=>K.delete(e.code));document.querySelector('#cast').onpointerdown=e=>{e.preventDefault();fire()};document.querySelector('#dodge').onpointerdown=e=>{e.preventDefault();dodge()};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let sid=null;function sm(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=31;if(l>m){dx*=m/l;dy*=m/l}nub.style.transform=`translate(${dx}px,${dy}px)`;V.x=dx/m;V.y=dy/m}stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);sm(e)};stick.onpointermove=e=>{if(e.pointerId===sid)sm(e)};function su(e){if(e.pointerId!==sid)return;sid=null;V.x=V.y=0;nub.style.transform=''}stick.onpointerup=stick.onpointercancel=su;
function hurt(d,from){if(P.inv>0)return;P.hp-=d;P.inv=.65;P.hit=.25;shake=10;flash=.12;let dx=P.x-from.x,dy=P.y-from.y,l=L(dx,dy);P.x+=dx/l*23;P.y+=dy/l*23;burst(P.x,P.y,14,2);M.push({x:P.x+R(-18,18),y:P.y+R(-18,18),r:9,life:8});if(P.hp<=0)finish(false);hud()}
function finish(ok){run=false;document.querySelector('#endTitle').textContent=ok?'The clearing blooms!':'The plush has been bonked.';document.querySelector('#endCopy').textContent=ok?'The guardian restores the old tree. Flowers return. Tiny potato: triumphant.':'The forest carefully gathers your stuffing. Dignity can be recovered on the next attempt.';end.classList.add('show')}
function update(dt){t+=dt;P.inv-=dt;P.dodge-=dt;P.cast-=dt;P.hit-=dt;shake*=Math.pow(.001,dt);flash-=dt;let mx=(K.has('KeyD')||K.has('ArrowRight')?1:0)-(K.has('KeyA')||K.has('ArrowLeft')?1:0)+V.x,my=(K.has('KeyS')||K.has('ArrowDown')?1:0)-(K.has('KeyW')||K.has('ArrowUp')?1:0)+V.y;if(mx||my){let l=L(mx,my),b=P.inv>0&&P.dodge>.43?2.7:1;P.x+=mx/l*P.speed*b*dt;P.y+=my/l*P.speed*b*dt}P.x=C(P.x,30,W-30);P.y=C(P.y,72,H-30);
for(const s of S){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}for(const e of E){let dx=P.x-e.x,dy=P.y-e.y,l=L(dx,dy);e.x+=dx/l*e.speed*dt;e.y+=dy/l*e.speed*dt;e.hurt-=dt;if(DS(e,P)<e.r+P.r-4)hurt(e.kind?14:9,e);for(const s of S)if(s.life>0&&DS(e,s)<e.r+s.r){e.hp-=20;s.life=0;e.hurt=.12;burst(s.x,s.y,7,0);if(e.hp<=0){e.dead=1;SE.push({x:e.x,y:e.y,r:8,b:R(0,7)});burst(e.x,e.y,16,0)}}}E=E.filter(e=>!e.dead);S=S.filter(s=>s.life>0&&s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);
for(const q of SE){q.b+=dt*4;if(DS(q,P)<30){q.got=1;P.score++;burst(q.x,q.y,14,1);if(P.score>=7&&!T.awake){T.awake=true;burst(T.x,T.y,32,0)}hud()}}SE=SE.filter(q=>!q.got);for(const m of M){m.life-=dt;if(DS(m,P)<30){m.dead=1;P.hp=C(P.hp+9,0,100);burst(m.x,m.y,7,2);hud()}}M=M.filter(m=>m.life>0&&!m.dead);
if(T.awake&&T.hp>0){if(DS(T,P)<T.r+P.r)hurt(12,T);for(const s of S)if(s.life>0&&DS(T,s)<T.r+s.r){T.hp-=12;s.life=0;shake=4;burst(s.x,s.y,8,1);if(T.hp<=0){T.hp=0;F.forEach(f=>f.on=true);burst(T.x,T.y,80,1);setTimeout(()=>finish(true),700)}}}for(const p of FX){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt}FX=FX.filter(p=>p.life>0);if(E.length===0&&!T.awake&&P.score<7)wave(Math.min(3+Math.floor(P.score/2),6))}
function leaf(px,py,s,a=0,col='#799e54'){x.save();x.translate(px,py);x.rotate(a);x.fillStyle=col;x.beginPath();x.ellipse(0,0,s*.55,s,0,0,Math.PI*2);x.fill();x.restore()}
function plush(px,py){x.save();x.translate(px,py+Math.sin(t*7)*2);if(P.hit>0)x.rotate(Math.sin(t*70)*.12);if(P.inv>0&&Math.floor(t*20)%2===0)x.globalAlpha=.45;x.strokeStyle='#59412e';x.lineWidth=7;x.lineCap='round';for(const side of[-1,1]){x.beginPath();x.moveTo(side*12,-22);x.quadraticCurveTo(side*28,-49,side*39,-68);x.moveTo(side*26,-48);x.lineTo(side*49,-55);x.moveTo(side*33,-58);x.lineTo(side*51,-72);x.stroke();leaf(side*43,-62,6,side*.6,'#718b4f')}x.fillStyle='#745a43';x.beginPath();x.ellipse(-25,5,15,22,-.3,0,Math.PI*2);x.ellipse(25,5,15,22,.3,0,Math.PI*2);x.fill();x.fillStyle='#d7bea0';x.beginPath();x.ellipse(0,-8,29,34,0,0,Math.PI*2);x.fill();x.strokeStyle='#b79878';x.lineWidth=1.5;for(let q=-14;q<=14;q+=7){x.beginPath();x.moveTo(q,-37);x.quadraticCurveTo(q-4,-8,q,25);x.stroke()}x.fillStyle='#171511';x.beginPath();x.ellipse(-10,-8,5,9,0,0,Math.PI*2);x.ellipse(10,-8,5,9,0,0,Math.PI*2);x.fill();x.fillStyle='#26392b';x.beginPath();x.arc(0,20,11,0,Math.PI*2);x.fill();x.fillStyle='#7b9b63';x.beginPath();x.arc(0,18,5,0,Math.PI*2);x.fill();x.fillStyle='#6b513e';x.beginPath();x.arc(-17,30,13,0,Math.PI*2);x.arc(17,30,13,0,Math.PI*2);x.fill();x.restore()}
function draw(){x.save();if(shake>1)x.translate(R(-shake,shake),R(-shake,shake));let g=x.createRadialGradient(W*.5,H*.46,40,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#36563e');g.addColorStop(1,'#14231a');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.globalAlpha=.22;for(let i=0;i<18;i++){let a=i/18*Math.PI*2,r=Math.max(W,H)*.49;x.fillStyle=i%2?'#64834d':'#3e633d';x.beginPath();x.arc(W*.5+Math.cos(a)*r,H*.52+Math.sin(a)*r,58,0,Math.PI*2);x.fill()}x.globalAlpha=1;for(const f of F)if(f.on){x.fillStyle='#d8c98e';for(let k=0;k<5;k++){let a=k/5*Math.PI*2;x.beginPath();x.arc(f.x+Math.cos(a)*6,f.y+Math.sin(a)*6,4,0,Math.PI*2);x.fill()}x.fillStyle='#d08f82';x.beginPath();x.arc(f.x,f.y,3,0,Math.PI*2);x.fill()}
x.save();x.translate(T.x,T.y);x.fillStyle=T.awake&&T.hp>0?'#29231f':'#4d3d2c';x.beginPath();x.arc(0,0,T.r,0,Math.PI*2);x.fill();for(let i=0;i<9;i++){let a=i/9*Math.PI*2;x.strokeStyle=T.awake?'#51394c':'#6e5638';x.lineWidth=11;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*80,Math.sin(a)*65);x.stroke();leaf(Math.cos(a)*75,Math.sin(a)*61,15,a,'#47643e')}x.fillStyle='#17110d';x.beginPath();x.arc(-15,-4,5,0,Math.PI*2);x.arc(15,-4,5,0,Math.PI*2);x.fill();if(T.awake){x.fillStyle='#0008';x.fillRect(-55,-T.r-22,110,8);x.fillStyle='#bd83c0';x.fillRect(-55,-T.r-22,110*T.hp/T.max,8)}x.restore();
for(const q of SE){x.fillStyle='#d7dd75';x.beginPath();x.ellipse(q.x,q.y+Math.sin(q.b)*4,6,10,.3,0,Math.PI*2);x.fill()}for(const m of M){x.fillStyle='#f4efe0';x.beginPath();x.arc(m.x,m.y,m.r,0,Math.PI*2);x.fill()}for(const e of E){x.save();x.translate(e.x,e.y);x.fillStyle=e.kind?'#76546f':'#463d2c';x.beginPath();x.arc(0,0,e.r,0,Math.PI*2);x.fill();x.fillStyle='#b9d96d';x.beginPath();x.arc(-6,-3,3,0,Math.PI*2);x.arc(6,-3,3,0,Math.PI*2);x.fill();x.restore()}for(const s of S){x.shadowBlur=16;x.shadowColor='#d8ef80';x.fillStyle='#d8ef80';x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();x.shadowBlur=0}plush(P.x,P.y);for(const p of FX){x.globalAlpha=C(p.life/.8,0,1);x.fillStyle=p.type===2?'#f4efe0':p.type===1?'#d9ef83':'#8aac5d';x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fill()}x.globalAlpha=1;if(flash>0){x.fillStyle='#fff4';x.fillRect(0,0,W,H)}x.restore()}
function loop(n){if(!run)return;let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('#go').onclick=()=>{start.classList.remove('show');reset();run=true;last=performance.now();requestAnimationFrame(loop)};document.querySelector('#again').onclick=()=>{end.classList.remove('show');reset();run=true;last=performance.now();requestAnimationFrame(loop)};reset();draw();
})();
</script>
</body></html>
