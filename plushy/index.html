<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#14231a"><title>Plushy Guardian</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none;text-shadow:0 2px 5px #000}.bars{width:min(72vw,410px);font-size:12px;display:grid;gap:5px}.row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}.bar{height:10px;border:1px solid #fff5;border-radius:20px;background:#0008;overflow:hidden}.bar i{height:100%;display:block;background:#eee3cb}.bar.forest i{background:#93c968;width:0}.objective{margin-top:6px;font-size:12px}.back{position:fixed;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));color:#fff9;text-decoration:none;font-size:12px}.panel{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,540px);padding:24px;border-radius:24px;border:1px solid #e8d8ba55;background:radial-gradient(circle at top,#334a38f5,#142119fb 72%);box-shadow:0 25px 80px #000c;text-align:center;display:none}.panel.show{display:block}.panel h1{font-size:clamp(36px,10vw,64px);line-height:.9;margin:0}.panel h1 small{font-size:.36em;color:#d8e8ca}.panel p{line-height:1.45;color:#d8dfd5}.panel button{border:1px solid #fff6;border-radius:999px;padding:13px 21px;font-size:16px;font-weight:900;background:#e6d4ae;color:#1c281f}.touch{position:fixed;z-index:5;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:18px;pointer-events:none}.stick{width:116px;height:116px;border-radius:50%;border:2px solid #fff3;background:#0005;position:relative;pointer-events:auto}.nub{width:52px;height:52px;position:absolute;left:30px;top:30px;border-radius:50%;background:#ead9b99f;box-shadow:inset 0 0 0 2px #fff4}.actions{display:flex;gap:12px;pointer-events:auto}.actions button{width:72px;height:72px;border-radius:50%;border:1px solid #fff5;background:#17291edf;color:#fff;font-size:31px}@media(pointer:fine) and (min-width:900px){.touch{display:none}}
</style></head><body><canvas id="game"></canvas><a class="back" href="/">sneaker.games ↗</a><div class="hud"><div class="bars"><div class="row"><span>Stuffing</span><div class="bar"><i id="hp"></i></div></div><div class="row"><span>Forest</span><div class="bar forest"><i id="forest"></i></div></div></div><div class="objective" id="objective"></div></div><div id="start" class="panel show"><h1>Plushy Guardian<br><small>of the Tiny Forest</small></h1><p>The art pass has begun. You are still very small. The forest remains unreasonably large.</p><p><b>Move:</b> left thumb / WASD<br><b>Vine spell:</b> ✨ / Space<br><b>Dodge:</b> 🍃 / Shift</p><button id="go">Begin Tiny Heroics</button></div><div id="end" class="panel"><h2 id="endTitle"></h2><p id="endCopy"></p><button id="again">Again, tiny guardian</button></div><div class="touch"><div id="stick" class="stick"><div id="nub" class="nub"></div></div><div class="actions"><button id="cast">✨</button><button id="dodge">🍃</button></div></div>
<script src="art/sprites-a.js"></script><script src="art/sprites-b.js"></script><script src="art/sprites-c.js"></script><script src="art/sprites-d.js"></script><script>(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hp=document.querySelector('#hp'),forest=document.querySelector('#forest'),objective=document.querySelector('#objective'),start=document.querySelector('#start'),end=document.querySelector('#end');
function decodeSprite(s){let c=document.createElement('canvas');c.width=s.w;c.height=s.h;let g=c.getContext('2d'),d=g.createImageData(s.w,s.h),a=d.data,at=0;for(const run of s.r.split(',')){let idx=parseInt(run.slice(-1),16),n=parseInt(run.slice(0,-1),36),hex=s.p[idx],r=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),al=parseInt(hex.slice(7,9),16);for(let j=0;j<n;j++){a[at++]=r;a[at++]=gg;a[at++]=b;a[at++]=al}}g.putImageData(d,0,0);return c}const A={};for(const [k,v] of Object.entries(window.SPR||{}))A[k]=decodeSprite(v)
let W,H,D=1,last=0,run=false,t=0,shake=0,flash=0,P,T,E,S,SE,M,FX,F;const K=new Set(),V={x:0,y:0};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),len=(x,y)=>Math.hypot(x,y)||1,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function reset(){P={x:W*.5,y:H*.64,r:25,hp:100,max:100,speed:205,inv:0,dodge:0,cast:0,score:0,hit:0,aimX:0,aimY:-1};T={x:W*.5,y:H*.22,r:60,hp:170,max:170,awake:false};E=[];S=[];SE=[];M=[];FX=[];F=[];for(let i=0;i<26;i++)F.push({x:rand(25,W-25),y:rand(80,H-25),on:false});wave(5);hud()}
const kinds=['sporeling','beetle','moth','squirrel','wisp'];
function wave(n){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),r=Math.max(W,H)*.42,k=kinds[Math.floor(rand(0,kinds.length))],spec={sporeling:[22,30,52],beetle:[21,42,45],moth:[20,28,83],squirrel:[23,38,67],wisp:[18,24,92]}[k];E.push({x:W*.5+Math.cos(a)*r,y:H*.5+Math.sin(a)*r,r:spec[0],hp:spec[1],speed:spec[2],kind:k,hurt:0,bob:rand(0,6.2)})}}
function hud(){hp.style.width=P.hp+'%';forest.style.width=clamp(P.score/7*100,0,100)+'%';objective.textContent=T.awake?'The Blighted Old Tree has awakened — cleanse it!':'Restore the clearing: '+Math.min(P.score,7)+' / 7 seeds'}
function burst(x,y,n=10,type=0){for(let i=0;i<n;i++)FX.push({x,y,vx:rand(-120,120),vy:rand(-120,70),life:rand(.35,.85),type,s:rand(3,8)})}
function fire(){if(!run||P.cast>0)return;P.cast=.29;let dx=P.aimX,dy=P.aimY;S.push({x:P.x+dx*30,y:P.y+dy*30,vx:dx*465,vy:dy*465,r:11,life:.9,a:Math.atan2(dy,dx)});burst(P.x+dx*20,P.y+dy*20,5,1)}
function dodge(){if(!run||P.dodge>0)return;P.dodge=.7;P.inv=.3;burst(P.x,P.y,12,0)}
addEventListener('keydown',e=>{K.add(e.code);if(e.code==='Space'){e.preventDefault();fire()}if(e.code.includes('Shift'))dodge()});addEventListener('keyup',e=>K.delete(e.code));document.querySelector('#cast').onpointerdown=e=>{e.preventDefault();fire()};document.querySelector('#dodge').onpointerdown=e=>{e.preventDefault();dodge()};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let sid=null;function sm(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=31;if(l>m){dx*=m/l;dy*=m/l}nub.style.transform=`translate(${dx}px,${dy}px)`;V.x=dx/m;V.y=dy/m}stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);sm(e)};stick.onpointermove=e=>{if(e.pointerId===sid)sm(e)};function su(e){if(e.pointerId!==sid)return;sid=null;V.x=V.y=0;nub.style.transform=''}stick.onpointerup=stick.onpointercancel=su;
function hurt(d,from){if(P.inv>0)return;P.hp-=d;P.inv=.62;P.hit=.25;shake=10;flash=.1;let dx=P.x-from.x,dy=P.y-from.y,l=len(dx,dy);P.x+=dx/l*22;P.y+=dy/l*22;burst(P.x,P.y,14,2);M.push({x:P.x+rand(-18,18),y:P.y+rand(-18,18),r:12,life:8});if(P.hp<=0)finish(false);hud()}
function finish(ok){run=false;endTitle.textContent=ok?'The clearing blooms!':'The plush has been bonked.';endCopy.textContent=ok?'The guardian restores the old tree. Flowers return. Tiny potato: triumphant.':'The forest gathers your stuffing. Dignity is recoverable.';end.classList.add('show')}
function update(dt){t+=dt;P.inv-=dt;P.dodge-=dt;P.cast-=dt;P.hit-=dt;shake*=Math.pow(.001,dt);flash-=dt;let mx=(K.has('KeyD')||K.has('ArrowRight')?1:0)-(K.has('KeyA')||K.has('ArrowLeft')?1:0)+V.x,my=(K.has('KeyS')||K.has('ArrowDown')?1:0)-(K.has('KeyW')||K.has('ArrowUp')?1:0)+V.y;if(mx||my){let l=len(mx,my),b=P.inv>0&&P.dodge>.39?2.7:1;P.aimX=mx/l;P.aimY=my/l;P.x+=P.aimX*P.speed*b*dt;P.y+=P.aimY*P.speed*b*dt}P.x=clamp(P.x,30,W-30);P.y=clamp(P.y,76,H-30);
for(const s of S){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}for(const e of E){e.bob+=dt*4;let dx=P.x-e.x,dy=P.y-e.y,l=len(dx,dy);e.x+=dx/l*e.speed*dt;e.y+=dy/l*e.speed*dt;e.hurt-=dt;if(dist(e,P)<e.r+P.r-3)hurt(e.kind==='beetle'?14:e.kind==='wisp'?11:9,e);for(const s of S)if(s.life>0&&dist(e,s)<e.r+s.r){e.hp-=20;s.life=0;e.hurt=.12;burst(s.x,s.y,7,0);if(e.hp<=0){e.dead=1;SE.push({x:e.x,y:e.y,r:8,b:rand(0,7)});burst(e.x,e.y,16,0)}}}E=E.filter(e=>!e.dead);S=S.filter(s=>s.life>0&&s.x>-40&&s.x<W+40&&s.y>-40&&s.y<H+40);
for(const q of SE){q.b+=dt*4;if(dist(q,P)<30){q.got=1;P.score++;burst(q.x,q.y,14,1);if(P.score>=7&&!T.awake){T.awake=true;burst(T.x,T.y,35,3)}hud()}}SE=SE.filter(q=>!q.got);for(const m of M){m.life-=dt;if(dist(m,P)<32){m.dead=1;P.hp=clamp(P.hp+9,0,100);burst(m.x,m.y,8,2);hud()}}M=M.filter(m=>m.life>0&&!m.dead);
if(T.awake&&T.hp>0){if(dist(T,P)<T.r+P.r)hurt(12,T);for(const s of S)if(s.life>0&&dist(T,s)<T.r+s.r){T.hp-=12;s.life=0;shake=4;burst(s.x,s.y,8,1);if(T.hp<=0){T.hp=0;F.forEach(f=>f.on=true);burst(T.x,T.y,80,1);setTimeout(()=>finish(true),650)}}}for(const p of FX){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt}FX=FX.filter(p=>p.life>0);if(E.length===0&&!T.awake&&P.score<7)wave(Math.min(3+Math.floor(P.score/2),6))}
function image(im,x,y,w,h,rot=0,alpha=1,flip=false){if(!im||!im.width)return false;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();return true}
function tree(){ctx.save();ctx.translate(T.x,T.y);ctx.fillStyle=T.awake&&T.hp>0?'#2b2027':'#4e3b2b';ctx.beginPath();ctx.arc(0,0,T.r,0,Math.PI*2);ctx.fill();for(let i=0;i<10;i++){let a=i/10*Math.PI*2;ctx.strokeStyle=T.awake?'#5b324f':'#76583a';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*82,Math.sin(a)*68);ctx.stroke()}ctx.fillStyle=T.awake?'#f254b8':'#17110d';ctx.beginPath();ctx.arc(-15,-4,5,0,Math.PI*2);ctx.arc(15,-4,5,0,Math.PI*2);ctx.fill();if(T.awake){ctx.fillStyle='#0009';ctx.fillRect(-58,-T.r-23,116,9);ctx.fillStyle='#cb5aad';ctx.fillRect(-58,-T.r-23,116*T.hp/T.max,9)}ctx.restore()}
function draw(){ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));let g=ctx.createRadialGradient(W*.5,H*.45,50,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#466a49');g.addColorStop(1,'#14231a');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);ctx.globalAlpha=.2;for(let i=0;i<22;i++){let a=i/22*Math.PI*2,r=Math.max(W,H)*.48;ctx.fillStyle=i%2?'#6c8d55':'#395d3c';ctx.beginPath();ctx.arc(W*.5+Math.cos(a)*r,H*.53+Math.sin(a)*r,62,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of F)if(f.on){ctx.fillStyle='#f0d49b';ctx.beginPath();ctx.arc(f.x,f.y,4,0,Math.PI*2);ctx.fill()}tree();
for(const q of SE){ctx.fillStyle='#dfe477';ctx.beginPath();ctx.ellipse(q.x,q.y+Math.sin(q.b)*4,6,10,.3,0,Math.PI*2);ctx.fill()}for(const m of M){if(!image(A.stuffing,m.x,m.y,38,30,0,.95)){ctx.fillStyle='#f4efe0';ctx.beginPath();ctx.arc(m.x,m.y,9,0,Math.PI*2);ctx.fill()}}
for(const e of E){let im=A[e.kind],h=e.kind==='squirrel'?58:e.kind==='moth'?56:e.kind==='sporeling'?52:48,w=h*(im.width&&im.height?im.width/im.height:1);let alpha=e.hurt>0?.55:1;if(!image(im,e.x,e.y+Math.sin(e.bob)*2,w,h,0,alpha)){ctx.fillStyle='#533d35';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()}}
for(const s of S){if(!image(A.vine,s.x,s.y,68,28,s.a,1)){ctx.fillStyle='#d8ef80';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}}
let pAlpha=P.inv>0&&Math.floor(t*20)%2===0?.45:1;image(A.guardian,P.x,P.y+Math.sin(t*7)*1.5,88,106,P.hit>0?Math.sin(t*70)*.1:0,pAlpha,P.aimX<-.2);for(const p of FX){ctx.globalAlpha=clamp(p.life/.8,0,1);ctx.fillStyle=p.type===2?'#f4efe0':p.type===3?'#d257a9':p.type===1?'#d9ef83':'#8aac5d';ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='#fff4';ctx.fillRect(0,0,W,H)}ctx.restore()}
function loop(n){if(!run)return;let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('#go').onclick=()=>{start.classList.remove('show');reset();run=true;last=performance.now();requestAnimationFrame(loop)};document.querySelector('#again').onclick=()=>{end.classList.remove('show');reset();run=true;last=performance.now();requestAnimationFrame(loop)};reset();draw();})();</script></body></html>
