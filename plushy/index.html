</style></head><body><canvas id="game"></canvas><a class="back" href="/">sneaker.games ↗</a><div class="hud"><div class="bars"><div class="row"><span>Stuffing</span><div class="bar"><i id="hp"></i></div></div><div class="row"><span>Level</span><div class="bar forest"><i id="forest"></i></div></div></div><div class="objective" id="objective"></div></div><div id="welcome" class="panel show"><h1>Plushy Guardian<br><small>of the Tiny Forest</small></h1><p>A small forest is waiting.</p><button id="enter">Enter the Forest</button></div><div id="start" class="panel"><h1 id="startTitle">Level 1<br><small>The Slime Clearing</small></h1><p id="startCopy">Three waves are oozing into the clearing. Survive them, then cleanse the blighted old tree.</p><p><b>Move:</b> left thumb / WASD<br><b>Vine spell:</b> ✨ / Space<br><b>Dodge:</b> 🍃 / Shift</p><button id="go">Defend the Clearing</button></div><div id="end" class="panel"><h2 id="endTitle"></h2><p id="endCopy"></p><button id="again"></button></div><div class="touch"><div id="stick" class="stick"><div id="nub" class="nub"></div></div><div class="actions"><button id="cast">✨</button><button id="dodge">🍃</button></div></div>

const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hp=document.querySelector('#hp'),forest=document.querySelector('#forest'),objective=document.querySelector('#objective'),welcome=document.querySelector('#welcome'),start=document.querySelector('#start'),end=document.querySelector('#end'),startTitle=document.querySelector('#startTitle'),startCopy=document.querySelector('#startCopy'),go=document.querySelector('#go'),again=document.querySelector('#again');

const Runtime={guardian:null,wisp:[],enemy:{}};function loadRuntimeImage(src,receive){const image=new Image();image.src=src;image.onload=()=>{receive(image);draw()}}loadRuntimeImage('art/runtime/guardian_idle.png',image=>Runtime.guardian=image);['art/runtime/forest_wisp_neutral.png','art/runtime/forest_wisp_stretch.png','art/runtime/forest_wisp_neutral.png','art/runtime/forest_wisp_tilt.png'].forEach((src,index)=>loadRuntimeImage(src,image=>Runtime.wisp[index]=image));[['bat','art/runtime/enemy_bat.svg'],['slime','art/runtime/enemy_slime.svg'],['mushroom','art/runtime/enemy_mushroom.svg']].forEach(([kind,src])=>loadRuntimeImage(src,image=>Runtime.enemy[kind]=image));

function reset(level=currentLevel){currentLevel=level;lastAimDirection={x:0,y:-1};P={x:W*.5,y:H*.64,r:25,hp:100,max:100,speed:205,inv:0,dodge:0,cast:0,score:0,hit:0};T={x:W*.5,y:H*.22,r:60,hp:LEVELS[level].tree,max:LEVELS[level].tree,awake:false};L={wave:1,max:3};E=[];S=[];SE=[];M=[];FX=[];F=[];for(let i=0;i<26;i++)F.push({x:rand(25,W-25),y:rand(80,H-25),on:false});wave(level===1?5:6);hud()}

function hud(){hp.style.width=P.hp+'%';forest.style.width=(T.awake?100:((L.wave-1)/L.max)*100)+'%';const cfg=LEVELS[currentLevel];objective.textContent=T.awake?`Level ${currentLevel} Finale · Cleanse the ${cfg.boss}!`:`Level ${currentLevel} · Wave ${L.wave} / ${L.max} · ${cfg.dominant} are dominant`}
function burst(x,y,n=10,type=0){for(let i=0;i<n;i++)FX.push({x,y,vx:rand(-120,120),vy:rand(-120,70),life:rand(.35,.85),type,s:rand(3,8)})}
function fire(){if(!run||P.cast>0)return;P.cast=.29;let {x:dx,y:dy}=lastAimDirection;S.push({x:P.x+dx*30,y:P.y+dy*30,vx:dx*465,vy:dy*465,r:11,life:.9,a:Math.atan2(dy,dx)});burst(P.x+dx*20,P.y+dy*20,5,1);window.PlushyMusic?.sfx.attack()}
function dodge(){if(!run||P.dodge>0)return;P.dodge=.7;P.inv=.3;burst(P.x,P.y,12,0);window.PlushyMusic?.sfx.dodge()}
addEventListener('keydown',e=>{K.add(e.code);if(e.code==='Space'){e.preventDefault();fire()}if(e.code.includes('Shift'))dodge()});addEventListener('keyup',e=>K.delete(e.code));document.querySelector('#cast').onpointerdown=e=>{e.preventDefault();fire()};document.querySelector('#dodge').onpointerdown=e=>{e.preventDefault();dodge()};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let sid=null;function sm(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),m=31;if(l>m){dx*=m/l;dy*=m/l}nub.style.transform=`translate(${dx}px,${dy}px)`;V.x=dx/m;V.y=dy/m}stick.onpointerdown=e=>{sid=e.pointerId;stick.setPointerCapture(sid);sm(e)};stick.onpointermove=e=>{if(e.pointerId===sid)sm(e)};function su(e){if(e.pointerId!==sid)return;sid=null;V.x=V.y=0;nub.style.transform=''}stick.onpointerup=stick.onpointercancel=su;
function hurt(d,from){if(P.inv>0)return;P.hp-=d;P.inv=.62;P.hit=.25;shake=10;flash=.1;let dx=P.x-from.x,dy=P.y-from.y,l=len(dx,dy);P.x+=dx/l*22;P.y+=dy/l*22;burst(P.x,P.y,14,2);M.push({x:P.x+rand(-18,18),y:P.y+rand(-18,18),r:12,life:8});if(P.hp<=0)finish(false);hud()}
function finish(ok){run=false;if(!ok){document.querySelector('#endTitle').textContent='The plush has been bonked.';document.querySelector('#endCopy').textContent='The forest wins this round. Dignity is recoverable.';again.textContent=`Replay Level ${currentLevel}`;again.dataset.action='replay'}else if(currentLevel===1){document.querySelector('#endTitle').textContent='Level 1 Clear!';document.querySelector('#endCopy').textContent='The Slime Clearing is safe. Deeper in the forest, purple shadows flutter between the trees.';again.textContent='Enter Level 2';again.dataset.action='next'}else{document.querySelector('#endTitle').textContent='Level 2 Clear!';document.querySelector('#endCopy').textContent='The Violet Canopy is quiet again. Even the bats have reconsidered their life choices.';again.textContent='Replay Level 2';again.dataset.action='replay'}end.classList.add('show')}
function update(dt){t+=dt;P.inv-=dt;P.dodge-=dt;P.cast-=dt;P.hit-=dt;shake*=Math.pow(.001,dt);flash-=dt;let mx=(K.has('KeyD')||K.has('ArrowRight')?1:0)-(K.has('KeyA')||K.has('ArrowLeft')?1:0)+V.x,my=(K.has('KeyS')||K.has('ArrowDown')?1:0)-(K.has('KeyW')||K.has('ArrowUp')?1:0)+V.y;if(mx||my){let l=len(mx,my),b=P.inv>0&&P.dodge>.39?2.7:1;lastAimDirection={x:mx/l,y:my/l};P.x+=lastAimDirection.x*P.speed*b*dt;P.y+=lastAimDirection.y*P.speed*b*dt}P.x=clamp(P.x,30,W-30);P.y=clamp(P.y,76,H-30);

if(T.awake&&T.hp>0){if(dist(T,P)<T.r+P.r)hurt(currentLevel===2?14:12,T);for(const s of S)if(s.life>0&&dist(T,s)<T.r+s.r){T.hp-=12;s.life=0;shake=4;burst(s.x,s.y,8,1);if(T.hp<=0){T.hp=0;F.forEach(f=>f.on=true);burst(T.x,T.y,80,1);setTimeout(()=>finish(true),650)}}}for(const p of FX){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;p.life-=dt}FX=FX.filter(p=>p.life>0)}
function image(im,x,y,w,h,rot=0,alpha=1,flip=false){if(!im||!im.width)return false;ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(rot);ctx.globalAlpha=alpha;if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();return true}
function enemyImage(e){let im=Runtime.enemy[e.kind];if(!im||!im.width)return false;let base=e.kind==='bat'?52:e.kind==='slime'?61:65,aspect=im.width/im.height,w=base*aspect,h=base,rot=0,y=e.y,dx=1,dy=1;if(e.kind==='bat'){y+=Math.sin(e.bob+e.phase)*6;rot=Math.sin(e.bob*.85+e.phase)*.13}else if(e.kind==='slime'){let hop=Math.abs(Math.sin(e.bob+e.phase));y-=hop*10;dx=1+(1-hop)*.12;dy=1-(1-hop)*.1}else{let hop=Math.max(0,Math.sin(e.bob+e.phase));y-=hop*8;rot=Math.sin(e.bob+e.phase)*.10;dx=1+(1-hop)*.05;dy=1-(1-hop)*.05}ctx.save();ctx.translate(Math.round(e.x),Math.round(y));ctx.rotate(rot);ctx.scale(e.sx*dx,e.sy*dy);ctx.globalAlpha=e.hurt>0?.55:1;ctx.filter=`hue-rotate(${e.hue}deg) saturate(1.05)`;ctx.imageSmoothingEnabled=true;ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();return true}
function imageFrame(sheet,frame,x,y,w,h,alpha=1,flip=false){if(!sheet||!sheet.width)return false;ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.globalAlpha=alpha;if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(sheet,frame*64,0,64,64,-w/2,-h/2,w,h);ctx.restore();return true}
function drawGuardian(alpha){const frame=Math.floor(t*5)%4;return imageFrame(Runtime.guardian,frame,P.x,P.y,96,96,alpha,lastAimDirection.x<-.2)}function drawAimWisp(){const frame=Math.floor(t*5)%4,wisp=Runtime.wisp[frame],x=P.x+lastAimDirection.x*40,y=P.y+lastAimDirection.y*40+Math.sin(t*5)*1.25;return image(wisp,x,y,36,36)}
function tree(){ctx.save();ctx.translate(T.x,T.y);let purple=currentLevel===2;ctx.fillStyle=T.awake&&T.hp>0?(purple?'#2d2038':'#2b2027'):(purple?'#574062':'#4e3b2b');ctx.beginPath();ctx.arc(0,0,T.r,0,Math.PI*2);ctx.fill();for(let i=0;i<10;i++){let a=i/10*Math.PI*2;ctx.strokeStyle=T.awake?(purple?'#71446f':'#5b324f'):(purple?'#765679':'#76583a');ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*82,Math.sin(a)*68);ctx.stroke()}ctx.fillStyle=T.awake?(purple?'#d575ff':'#f254b8'):'#17110d';ctx.beginPath();ctx.arc(-15,-4,5,0,Math.PI*2);ctx.arc(15,-4,5,0,Math.PI*2);ctx.fill();if(T.awake){ctx.fillStyle='#0009';ctx.fillRect(-58,-T.r-23,116,9);ctx.fillStyle=purple?'#b86bd5':'#cb5aad';ctx.fillRect(-58,-T.r-23,116*T.hp/T.max,9)}ctx.restore()}

function loop(n){if(!run)return;let dt=Math.min((n-last)/1000,.033);last=n;update(dt);draw();requestAnimationFrame(loop)}
function startRun(level){currentLevel=level;start.classList.remove('show');end.classList.remove('show');reset(level);run=true;last=performance.now();requestAnimationFrame(loop)}document.querySelector('#enter').onclick=async()=>{if(await window.PlushyMusic?.beginFromGesture()){welcome.classList.remove('show');start.classList.add('show')}};go.onclick=()=>startRun(1);again.onclick=()=>{if(again.dataset.action==='next'){currentLevel=2;startTitle.innerHTML='Level 2<br><small>The Violet Canopy</small>';startCopy.textContent='The forest darkens to violet. Bat swarms own this stretch of canopy; push through three waves and cleanse the twilight tree.';go.textContent='Enter the Violet Canopy';end.classList.remove('show');start.classList.add('show');go.onclick=()=>startRun(2)}else startRun(currentLevel)};reset(1);draw();})();</script></body></html>
